# Publie le plan sur GitHub Pages à chaque push sur main :
# https://ninascherrer.github.io/Ocellis-Plan-/
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Le PDF d'implantation (confidentiel) n'est pas publié.
          VITE_CALQUE_PDF: '0'
      # Copie hors ligne (fichier HTML unique), téléchargeable depuis le site.
      - run: npm run build:hors-ligne && cp dist-hors-ligne/ocellis-plan-hors-ligne.html dist/
        env:
          VITE_CALQUE_PDF: '0'
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
